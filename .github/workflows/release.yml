# Push a tag like v1.0.0 → tests, universal build, checksums, build provenance (public repos), GitHub release.
# Assets: <App>.zip (ad-hoc signed), make-cert.sh (if the app has one), SHA256SUMS.
# scripts/get.sh installs them and signs on the user's Mac.
name: Release
on:
  push:
    tags: ["v*"]

env:
  APP: Poof

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance (Sigstore)
  attestations: write   # store it, so `gh attestation verify` works

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Test
        run: ./scripts/test.sh

      - name: Build (universal, ad-hoc signed)
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          UNIVERSAL=1 SIGN_ID=- ./scripts/build.sh
          lipo -archs "build/$APP.app/Contents/MacOS/$APP"

      - name: Package
        run: |
          ditto -c -k --keepParent "build/$APP.app" "$APP.zip"
          files="$APP.zip"
          if [ -f scripts/make-cert.sh ]; then cp scripts/make-cert.sh .; files="$files make-cert.sh"; fi
          shasum -a 256 $files > SHA256SUMS
          cat SHA256SUMS

      # GitHub offers artifact attestations on public repos (private ones need Enterprise Cloud).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" $(awk '{print $2}' SHA256SUMS) SHA256SUMS \
            --title "$APP ${GITHUB_REF_NAME}" --generate-notes
